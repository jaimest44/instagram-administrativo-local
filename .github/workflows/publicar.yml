name: Publicar en Instagram

on:
  schedule:
    # GitHub retrasa los cron a veces horas: se lanza cada 30 min por la tarde y
    # publicar.py solo publica a partir de HORA_PUBLICACION (hora de Madrid), una vez al dia;
    # si llega pasada la medianoche (antes de las 06:00) publica aun el carrusel del dia anterior.
    - cron: "17,47 11-13 * * *"   # franja de mediodia (14:00 Madrid)
    - cron: "17,47 17-23 * * *"
    - cron: "17,47 0-3 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar | simular | comprobar | diagnosticar"
        default: "comprobar"
        required: true

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST || 'graph.facebook.com' }}
        run: |
          MODO="${{ github.event.inputs.modo || 'publicar' }}"
          if [ "$MODO" = "publicar" ]; then
            python publicador/publicar.py
          else
            python publicador/publicar.py --$MODO
          fi

      - name: Guardar registro de publicaciones
        if: always()
        run: |
          if [ -n "$(git status --porcelain estado/publicadas.json)" ]; then
            git config user.name "publicador-instagram"
            git config user.email "actions@users.noreply.github.com"
            git add estado/publicadas.json
            git commit -m "Publicado $(date +%F)"
            git pull --rebase
            git push
          fi
