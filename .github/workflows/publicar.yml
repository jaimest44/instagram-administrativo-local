name: Publicar en Instagram

on:
  schedule:
    # GitHub se salta muchos cron (el 30/10/2026 ninguno entre las 07:00 y las 17:00), asi que se
    # lanza cada 20 min en las horas de publicacion (UTC, cubre verano e invierno). publicar.py solo
    # publica la franja que toca y una vez; `concurrency` evita dos a la vez. De madrugada (antes
    # de las 06:00) publica aun el carrusel del dia anterior.
    - cron: "7,27,47 9-14 * * *"    # 11:00 y 14:00 Madrid
    - cron: "7,27,47 16-23 * * *"   # 18:00 y 20:30 Madrid
    - cron: "17,47 0-3 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar | simular | comprobar | diagnosticar | probar_reel"
        default: "comprobar"
        required: true
      carpeta:
        description: "solo para probar_reel: carpeta de cola/ a probar (opcional)"
        required: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PROBAR_CARPETA: ${{ github.event.inputs.carpeta }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST || 'graph.facebook.com' }}
        run: |
          MODO="${{ github.event.inputs.modo || 'publicar' }}"
          if [ "$MODO" = "publicar" ]; then
            python publicador/publicar.py
          else
            python publicador/publicar.py --$MODO
          fi

      - name: Guardar registro de publicaciones
        if: always()
        run: |
          if [ -n "$(git status --porcelain estado/publicadas.json)" ]; then
            git config user.name "publicador-instagram"
            git config user.email "actions@users.noreply.github.com"
            git add estado/publicadas.json
            git commit -m "Publicado $(date +%F)"
            git pull --rebase
            git push
          fi
